<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappy - Input</title>
    <link href="static/homepage/homepage.css" rel="stylesheet" type="text/css" media="all">
    <link type="image/png" rel="icon" href="map_small.png">
  </head>
  <body>
    <h1><img src="map_small.png" width="50" height="50"><span class="text">Mappy</span></h1>
    <div id="top-bar">
      <div id="account-bar"></div>
      <a id="my-maps-btn" href="library.html">my past maps</a>
    </div>
    <div id="desc">
      <h4>Please input text, choose a picture, or speak-to-type to proceed. We will help you find related words.</h4>
    </div>
    <div class="container">
      <form id="text" action="map.html" method="GET">
        <label for="textentry"> enter a word:</label>
        <input type="text" required id="textentry" name="word"/>
        <input type="submit" value="submit">
      </form>

      <div class="input-group">
        <button id="mic-btn" type="button">say a word</button>
        <div id="speech-box" hidden>
          <p id="speech-status"></p>
          <div id="speech-choices"></div>
        </div>
      </div>

      <div class="input-group">
        <button id="photo-btn" type="button">use a picture</button>
        <input id="photo-input" type="file" accept="image/*" hidden>
        <div id="photo-box" hidden>
          <img id="photo-preview" alt="your picture">
          <p id="photo-status"></p>. 
          <div id="photo-choices"></div>
        </div>
      </div>
    </div>
    <script type="module" src="static/homepage/account.js"></script>
    <script src="static/homepage/speech.js"></script>
    <script type="module" src="static/homepage/photo.js"></script>
  </body>
</html>
